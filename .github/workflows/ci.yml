name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      # The released BPP tools, as users get them. End-to-end tests that need
      # a tool with no release for the runner (e.g. bpp-seqs on macOS) skip.
      - run: bpp-mcp install-tools
      - run: python -m pytest -v -rs

  install:
    # Runs install.sh from this checkout, as a user would, and checks that
    # every tool with a prebuilt release for the runner installs and runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        run: BPP_MCP_SPEC="$GITHUB_WORKSPACE" sh ./install.sh
      - name: check installed tools
        run: |
          PY="$("$HOME/.local/bin/uv" tool dir)/bpp-mcp/bin/python"
          cd "$RUNNER_TEMP" && env -i HOME="$HOME" PATH=/usr/bin:/bin "$PY" - <<'PY'
          from bpp_mcp import install
          from bpp_mcp.tools import env
          out = env.check_environment()
          bad = []
          for name, info in out["tools"].items():
              want = install.available(name)
              print(f"{name}: release for this platform={want}, found={info['found']}, "
                    f"version={info.get('version')}, ok={info.get('ok')}")
              if want and not info.get("ok"):
                  bad.append(name)
          assert not bad, f"installed but not working: {bad}"
          PY
