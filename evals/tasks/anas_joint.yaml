# Joint species delimitation and species tree (A11).
request: >
  I'm not sure my five putative fruit-fly species are all real, and I'm not sure of the tree either. Can BPP sort out both at once? Please help me set it up.
fixtures: [anastrepha]
decisions:
  - My data are aligned FASTA files, one locus per file, in the folder loci/. There are 10 loci.
  - imap.txt in the project folder says which sample belongs to which species.
  - The five species are turpiniae, suspensa, distincta, fraterculus and obliqua.
  - I want to estimate both the species limits and the species tree in one analysis.
  - 'As a starting or guide tree use: The relationships I believe in: fraterculus and obliqua are sisters; distincta is sister to that pair; suspensa is sister to those three; turpiniae is the outgroup.'
  - Each sequence is a single phased haplotype, so nothing needs phasing.
  - I do not want to model gene flow.
  - I have no opinion on chain length; whatever the assistant recommends as a sensible start is fine.
  - 'File and job names: anything sensible is fine. Use all the default data filters.'
  - "For the delimitation algorithm and its settings I will take the assistant's recommendation from the manual."
expect:
  analysis: A11
  species: [turpiniae, suspensa, distincta, fraterculus, obliqua]
  keywords:
    nloci: 10
    speciesdelimitation: {regex: '1 .+'}
    speciestree: {regex: '1.*'}
