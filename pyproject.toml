[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpp-mcp"
dynamic = ["version"]
description = "MCP server that guides BPP analysis setup, from raw data to a tested control file"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bpp-mcp = "bpp_mcp.server:main"

[tool.hatch.version]
path = "src/bpp_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bpp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
